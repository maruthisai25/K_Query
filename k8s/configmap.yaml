apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-copilot-config
data:
  prometheus-url: "http://prometheus-server:80"
  qdrant-url: "http://qdrant:6333"
  model-path: "llama2:7b"
  ollama-host: "localhost"
  ollama-port: "11434"
---
apiVersion: v1
kind: Secret
metadata:
  name: infra-copilot-secrets
type: Opaque
stringData:
  slack-bot-token: "xoxb-your-bot-token-here"
  slack-signing-secret: "your-signing-secret-here"