apiVersion: v1
kind: Service
metadata:
  name: infra-copilot
  labels:
    app: infra-copilot
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 11434
    targetPort: 11434
    protocol: TCP
    name: ollama
  selector:
    app: infra-copilot
---
apiVersion: v1
kind: Service
metadata:
  name: infra-copilot-internal
  labels:
    app: infra-copilot
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: infra-copilot