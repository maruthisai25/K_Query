# Model cache for the ollama Deployment (k8s/ollama.yaml), mounted at /models
# via OLLAMA_MODELS. Without it, llama2:7b is re-pulled on every restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k-query-ollama
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
