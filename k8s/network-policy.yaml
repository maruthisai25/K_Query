apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k-query-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: k-query
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: slack-bot
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: default
    ports:
    - protocol: TCP
      port: 6333  # Qdrant
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090  # Prometheus
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443   # Kubernetes API
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53    # DNS
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443   # External HTTPS (Slack API)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: infra-copilot
    ports:
    - protocol: TCP
      port: 6333
    - protocol: TCP
      port: 6334
