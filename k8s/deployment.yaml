apiVersion: apps/v1
kind: Deployment
metadata:
  name: k-query
  labels:
    app: k-query
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k-query
  template:
    metadata:
      labels:
        app: k-query
    spec:
      serviceAccountName: k-query
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: k-query
        image: k-query:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: k-query-secrets
              key: slack-bot-token
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: k-query-secrets
              key: slack-signing-secret
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: k-query-config
              key: prometheus-url
        - name: QDRANT_URL
          valueFrom:
            configMapKeyRef:
              name: k-query-config
              key: qdrant-url
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: k-query-config
              key: model-path
        - name: OLLAMA_HOST
          valueFrom:
            configMapKeyRef:
              name: k-query-config
              key: ollama-host
        - name: OLLAMA_PORT
          valueFrom:
            configMapKeyRef:
              name: k-query-config
              key: ollama-port
        # Sized for the app process only. Inference memory belongs to the
        # ollama Deployment (k8s/ollama.yaml), not here.
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Liveness asks only whether this process is serving. /health reports on
        # Qdrant, Ollama, Prometheus and the Kubernetes API and returns 503 if
        # any is down -- as a livenessProbe that turns a Prometheus blip into a
        # restart of every app pod.
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        # Readiness gates on Qdrant and Ollama only. /health also covers
        # Prometheus, which these manifests do not deploy, so using it here
        # left the pods permanently NotReady and the Service with no endpoints.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        # Cache for the all-MiniLM-L6-v2 encoder. emptyDir, not a PVC: it is
        # ~90 MB, re-downloadable, and the Deployment scales past one replica.
        - name: encoder-cache
          mountPath: /app/.cache
      volumes:
      - name: encoder-cache
        emptyDir: {}